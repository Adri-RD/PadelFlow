<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PadelFlow — Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-light: #E1F5EE;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9faf8;
      --card: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .panel-left {
      background: var(--green-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
      position: relative;
      overflow: hidden;
    }
    .panel-left::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      top: -100px; left: -100px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: #fff;
    }
    .panel-hero { z-index: 1; }
    .panel-hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 38px;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .panel-hero p {
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      line-height: 1.6;
      max-width: 300px;
    }
    .check-list { z-index: 1; }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .check-icon {
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .panel-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .form-box {
      width: 100%;
      max-width: 400px;
    }
    .form-box h2 {
      font-size: 26px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .form-box .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: var(--green); }
    .input-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--green-dark); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #9FE1CB; cursor: not-allowed; }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }
    .success-msg {
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }
    .link-row {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 1.5rem;
    }
    .link-row a {
      color: var(--green-dark);
      font-weight: 500;
      text-decoration: none;
    }
    .link-row a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
    }
  </style>
</head>
<body>

<div class="panel-left">
  <div class="brand">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="12" rx="9" ry="9" stroke="#fff" stroke-width="1.5"/>
        <line x1="3" y1="12" x2="21" y2="12" stroke="#fff" stroke-width="1.5"/>
        <path d="M5 7.5 Q12 10 19 7.5" stroke="#fff" stroke-width="1.2" fill="none"/>
        <path d="M5 16.5 Q12 14 19 16.5" stroke="#fff" stroke-width="1.2" fill="none"/>
      </svg>
    </div>
    <span class="brand-name">PadelFlow</span>
  </div>

  <div class="panel-hero">
    <h1>Únete al club</h1>
    <p>Crea tu cuenta gratis y empieza a reservar pistas hoy mismo.</p>
  </div>

  <div class="check-list">
    <div class="check-item">
      <div class="check-icon">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      Reserva en cualquier momento
    </div>
    <div class="check-item">
      <div class="check-icon">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      Cancela hasta 2h antes sin coste
    </div>
    <div class="check-item">
      <div class="check-icon">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      Historial completo de reservas
    </div>
  </div>
</div>

<div class="panel-right">
  <div class="form-box">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Rellena tus datos para registrarte</p>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Juan"/>
      </div>
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="García"/>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="juan@email.com"/>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono (opcional)</label>
      <input type="tel" id="telefono" placeholder="612 345 678"/>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres"/>
      <div class="input-hint">Al menos 6 caracteres</div>
    </div>

    <div class="form-group">
      <label for="password2">Repite la contraseña</label>
      <input type="password" id="password2" placeholder="••••••••"/>
    </div>

    <button class="btn" id="btn-register" onclick="register()">Crear cuenta</button>

    <div class="link-row">
      ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';

  async function register() {
    const nombre   = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const email    = document.getElementById('email').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const password = document.getElementById('password').value;
    const password2= document.getElementById('password2').value;
    const btn      = document.getElementById('btn-register');
    const err      = document.getElementById('error-msg');
    const ok       = document.getElementById('success-msg');

    err.style.display = 'none';
    ok.style.display = 'none';

    if (!nombre || !apellido || !email || !password) {
      err.textContent = 'Por favor rellena todos los campos obligatorios.';
      err.style.display = 'block'; return;
    }
    if (password.length < 6) {
      err.textContent = 'La contraseña debe tener al menos 6 caracteres.';
      err.style.display = 'block'; return;
    }
    if (password !== password2) {
      err.textContent = 'Las contraseñas no coinciden.';
      err.style.display = 'block'; return;
    }

    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, apellido, email, telefono, password })
      });

      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.mensaje || 'El correo ya está registrado.');
      }

      ok.textContent = '¡Cuenta creada! Redirigiendo al login...';
      ok.style.display = 'block';
      setTimeout(() => window.location.href = 'index.html', 2000);

    } catch (e) {
      err.textContent = e.message || 'Error al conectar con el servidor.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') register();
  });
</script>

</body>
</html>
